[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "family-insurance-review"
version = "3.2"
description = "家庭保单自助检视工具：分类、缺口诊断、冲突检测、HTML 报告"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TRAE Skill Architect"}]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0"]

[project.scripts]
insurance-review = "insurance_review:main"

[tool.setuptools]
py-modules = ["insurance_review"]
include-package-data = true

[tool.setuptools.package-data]
"family-insurance-review" = ["SKILL.md", "adapters/*", "fixtures/*"]

# ============== pytest 配置 ==============
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
